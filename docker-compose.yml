version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_invoices
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - archichat-network

  archichat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archichat_app
    ports:
      - "5000:5000"
    volumes:
      - ./Data:/app/Data
      - ./templates:/app/templates
      - ./static:/app/static
      - ./logo_image.jpg:/app/logo_image.jpg
      - ./background_image.jpg:/app/background_image.jpg
      - ./placement_image.jpg:/app/placement_image.jpg
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - FLASK_ENV=production
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - archichat-network

networks:
  archichat-network:
    driver: bridge

volumes:
  qdrant_storage:
